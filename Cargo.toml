[package]
name = "rust_linux_kernel"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0"
description = "Linux kernel written in Rust"

[dependencies]
# Core synchronization primitives
lock_api = "0.4"
spin = "0.9"
lazy_static = "1.4"
cfg-if = "1.0"

# Missing dependencies (now added)
parking_lot = "0.12.1"
atomic-waker = "1.1.2"
libc = "0.2.153"
once_cell = "1.19.0"
bitflags = "2.4.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rust_linux_kernel"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
